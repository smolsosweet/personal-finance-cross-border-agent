spring.datasource.url=jdbc:h2:file:./finance-phase1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.thymeleaf.cache=false
server.error.include-message=always

server.servlet.session.tracking-modes=cookie
app.demo-tools-enabled=${APP_DEMO_TOOLS_ENABLED:true}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
finbridge.llm.enabled=${FINBRIDGE_LLM_ENABLED:false}
finbridge.llm.provider=${FINBRIDGE_LLM_PROVIDER:openai}
finbridge.llm.model=${FINBRIDGE_LLM_MODEL:}
finbridge.llm.api-key=${OPENAI_API_KEY:}
finbridge.llm.gemini-api-key=${GEMINI_API_KEY:}
finbridge.llm.base-url=${FINBRIDGE_LLM_BASE_URL:http://localhost:11434}
finbridge.llm.connect-timeout=${FINBRIDGE_LLM_CONNECT_TIMEOUT:3s}
finbridge.llm.request-timeout=${FINBRIDGE_LLM_REQUEST_TIMEOUT:60s}
finbridge.document-ai.gemini-api-key=${GEMINI_API_KEY:}
finbridge.document-ai.model=${FINBRIDGE_DOCUMENT_AI_MODEL:gemini-3.5-flash-lite}
finbridge.document-ai.connect-timeout=${FINBRIDGE_DOCUMENT_AI_CONNECT_TIMEOUT:10s}
finbridge.document-ai.provider=${BILL_AI_PROVIDER:local}
finbridge.document-ai.local-ocr-url=${BILL_LOCAL_OCR_URL:http://localhost:8099/api/ocr}
finbridge.document-ai.ollama-base-url=${OLLAMA_BASE_URL:http://localhost:11434}
finbridge.document-ai.ollama-model=${OLLAMA_MODEL:qwen3:4b}
finbridge.document-ai.local-connect-timeout=${BILL_AI_CONNECT_TIMEOUT:4s}
