# Opt-in development/demo profile. The default profile remains AI-disabled.
finbridge.llm.enabled=${FINBRIDGE_LLM_ENABLED:true}
finbridge.llm.provider=${FINBRIDGE_LLM_PROVIDER:ollama}
finbridge.llm.model=${FINBRIDGE_LLM_MODEL:qwen3:4b}
finbridge.llm.base-url=${FINBRIDGE_LLM_BASE_URL:http://localhost:11434}
finbridge.llm.connect-timeout=${FINBRIDGE_LLM_CONNECT_TIMEOUT:3s}
finbridge.llm.request-timeout=${FINBRIDGE_LLM_REQUEST_TIMEOUT:60s}
