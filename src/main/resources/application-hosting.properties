# One shared, synthetic workspace. Intentionally ephemeral: every JVM restart starts from seed.
server.address=0.0.0.0
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:mem:finbridge_shared_demo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.thymeleaf.cache=true
server.error.include-message=never
app.shared-demo=true
app.demo-tools-enabled=true
finbridge.llm.enabled=${FINBRIDGE_LLM_ENABLED:true}
finbridge.llm.model=${FINBRIDGE_LLM_MODEL:gemini-3.5-flash-lite}
finbridge.llm.gemini-api-key=${GEMINI_API_KEY:}
# Allow a new outbound connection more time on shared cloud instances; keep the request bounded.
finbridge.llm.connect-timeout=${FINBRIDGE_LLM_CONNECT_TIMEOUT:10s}
finbridge.llm.request-timeout=${FINBRIDGE_LLM_REQUEST_TIMEOUT:30s}
finbridge.document-ai.model=${FINBRIDGE_DOCUMENT_AI_MODEL:gemini-3.5-flash-lite}
finbridge.document-ai.gemini-api-key=${GEMINI_API_KEY:}
finbridge.document-ai.connect-timeout=${FINBRIDGE_DOCUMENT_AI_CONNECT_TIMEOUT:10s}
